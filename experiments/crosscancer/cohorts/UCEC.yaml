# claim_level: hypothesis_only · critic_status: pending
# split = site-disjoint(make_split.py) 재사용. 새 split 정책 발명 금지.
# ⚠️ 사전등록 밖 탐색적 확장 — 본문에서 "법칙을 6암종에서 검정"으로 승격 금지.
#    HER2-amp 결과가 blind로 나오면 유방·위 HER2 앵커의 3번째 장기 복제로만 서술(확증 강도는 검정력에 따름).
